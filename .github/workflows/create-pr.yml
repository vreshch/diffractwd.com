name: Create Draft PR
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name'
        required: true
        type: string
      title:
        description: 'PR title'
        required: true
        type: string

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --draft \
            --title "${{ inputs.title }}" \
            --base master \
            --head "${{ inputs.branch }}" \
            --body "## Summary
          - Restores proper spacing between sidebar navigation and page content lost during Bootstrap → Tailwind CSS migration
          - Restores sidebar link colors using existing \`--color-primary\` theme token (#2b6892)
          - Adds visual weight (\`font-semibold\`) to active navigation item

          ## What changed
          - **layout.tsx**: Added \`md:gap-6\` to sidebar/content flex container to replicate Bootstrap column gutters
          - **sidebar.tsx**: Added \`text-primary\` color class and \`font-semibold\` on active state to nav links

          ## Before / After

          ### Full page
          | Before | After |
          |--------|-------|
          | ![before-home](https://raw.githubusercontent.com/vreshch/diffractwd.com/7f8ce08f6585ccf6a173aa464bdeb954608d727e/pr-screenshots/before-home.png) | ![after-home](https://raw.githubusercontent.com/vreshch/diffractwd.com/7f8ce08f6585ccf6a173aa464bdeb954608d727e/pr-screenshots/after-home.png) |

          ### Sidebar close-up
          | Before | After |
          |--------|-------|
          | ![before-sidebar](https://raw.githubusercontent.com/vreshch/diffractwd.com/7f8ce08f6585ccf6a173aa464bdeb954608d727e/pr-screenshots/before-sidebar.png) | ![after-sidebar](https://raw.githubusercontent.com/vreshch/diffractwd.com/7f8ce08f6585ccf6a173aa464bdeb954608d727e/pr-screenshots/after-sidebar.png) |

          ## Test plan
          - [ ] Verify sidebar links appear in blue (#2b6892) instead of black
          - [ ] Verify spacing between sidebar and content area matches old table-like layout
          - [ ] Verify active page link is visually distinct
          - [ ] Verify mobile hamburger menu still works

          > **Note:** The \`pr-screenshots/\` directory and \`.github/workflows/create-pr.yml\` should be removed before merging.

          https://claude.ai/code/session_01A7cr6vtJAAdXCHuxcBXFHm"
